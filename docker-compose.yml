services:
  homelab-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8050:3000" # Access UI at http://<DOCKER_HOST_IP>:8050
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DOCKER_SOCKET=/var/run/docker.sock
      - PROXMOX_URL=https://192.168.18.224:8006
      - PROXMOX_NODE=pve
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID:-}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET:-}
      - PROXMOX_REJECT_UNAUTHORIZED=false
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY:-}
      - TAILSCALE_TAILNET=${TAILSCALE_TAILNET:-}
      - TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock
      - STORAGE_MOUNTS=/,/mnt/hdd-media,/mnt/hdd-cloud,/mnt/hdd-music
      - POLL_INTERVAL_MS=2000
      - DEMO_MODE=${DEMO_MODE:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MANAGED_CONTAINERS=${MANAGED_CONTAINERS:-jellyfin,nextcloud,t3-code,nginx-proxy-manager,uptime-kuma,portainer-ce,transmission,paperless-ngx,home-assistant}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_CHECK_INTERVAL_MS=${GITHUB_CHECK_INTERVAL_MS:-300000}
      - BACKUP_RCLONE_REMOTE=${BACKUP_RCLONE_REMOTE:-}
      - BACKUP_SOURCE_PATHS=${BACKUP_SOURCE_PATHS:-/app/data,/projects}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-0}
      - SSH_TARGETS=${SSH_TARGETS:-}
    volumes:
      # Persistent Owner Auth & Sessions
      - ./data:/app/data
      # Docker Socket access for real-time container metrics & control
      - /var/run/docker.sock:/var/run/docker.sock
      # Tailscale Daemon Socket (optional: allows reading live local tailscaled status)
      - /var/run/tailscale:/var/run/tailscale:ro
      # Storage mount points (read-only) for storage capacity matrix
      - /mnt/hdd-media:/mnt/hdd-media:ro
      - /mnt/hdd-cloud:/mnt/hdd-cloud:ro
      - /mnt/hdd-music:/mnt/hdd-music:ro
      # Git Projects: working trees for pull/rebuild live here on the host,
      # e.g. ${GIT_PROJECTS_ROOT}/myapp. Read-write — git pull writes to it.
      # Each project's docker-compose build context must also live under
      # this same tree so the daemon's `docker compose build` can read it.
      - ${GIT_PROJECTS_ROOT:-/opt/homelab-projects}:/projects
      # rclone remote config for backup/restore, set up once yourself on the
      # host with `rclone config` — Cockpit never handles Drive/Nextcloud
      # OAuth itself, only runs `rclone sync` against whatever you configure.
      # T3 Code AI agent telemetry (read-only SQLite state and caches)
      - ${T3_DATA_PATH:-/var/lib/docker/volumes/docker-compose_t3code_data/_data/.t3}:/root/.t3:ro
      # In-browser terminal: one shared private key for every SSH_TARGETS
      # entry. Generate this pair yourself and put the public half in
      # authorized_keys on each target — Cockpit never generates or accepts
      # a key through the UI.
      - ${SSH_PRIVATE_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/cockpit_id_rsa:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
